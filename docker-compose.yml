services:
  qbittorrent:
    image: linuxserver/qbittorrent:4.5.2
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent_config:/config
      - torrents_data:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
    networks:
      - vpn_net
  ftp:
    image: stilliard/pure-ftpd:1.0.49
    container_name: ftp
    restart: unless-stopped
    ports:
      - "21:21"
      - "30000-30009:30000-30009" # Passive ports
    volumes:
      - torrents_data:/home/ftpusers/myuser
    environment:
      - TZ=Europe/Paris
      - PUBLICHOST=172.30.219.204
      - FTP_USER_NAME=myuser
      - FTP_USER_PASS=mypassword
      - FTP_USER_HOME=/home/ftpusers/myuser
    networks:
      - fileshare_net
      
  vpn:
    image: dperson/openvpn-client
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    volumes:
      - ./vpn-config:/vpn
    command: "-f '' -r '192.168.1.0/24'" # Adjust routing as needed
    networks:
      - vpn_net

networks:
  fileshare_net:
    driver: bridge
  vpn_net:
    driver: bridge

volumes:
  qbittorrent_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${APPDATA_PATH}/qBittorrent
  torrents_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TORRENTS_DATA_PATH}

