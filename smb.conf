[global]
   workgroup = WORKGROUP
   server string = Samba Server
   log file = /var/log/samba/log.%m
   max log size = 50
   security = user
   map to guest = bad user

[shared]
   path = /shared
   writable = yes
   browsable = no
   guest ok = no
   valid users = myuser
   create mask = 0777
   directory mask = 0770
